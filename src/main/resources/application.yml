server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: switchmate-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:h2:mem:switchmate;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:create-drop}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha
    tags-sorter: alpha

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:U3dpdGNobWF0ZS1sb2NhbC1kZXYta2V5LTIwMjYtMDkt}
  storage:
    resume-directory: ${RESUME_STORAGE_DIRECTORY:./uploads/resumes}
  openai:
    api-key: ${OPENAI_API_KEY:}
    api-key-openrouter: ${OPENROUTER_API_KEY:}
    endpoint: ${OPENAI_ENDPOINT:https://api.openai.com/v1/chat/completions}
    endpoint-openrouter: ${OPENROUTER_ENDPOINT:https://openrouter.ai/api/v1/chat/completions}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    model-openrouter: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
  admin:
    api-key: ${ADMIN_API_KEY:local-ingest-key}
  jobs:
    ingestion:
      enabled: ${JOB_INGESTION_ENABLED:false}
      cron: ${JOB_INGESTION_CRON:0 0 */6 * * *}
    http:
      connect-timeout: ${JOB_SOURCE_CONNECT_TIMEOUT:3s}
      read-timeout: ${JOB_SOURCE_READ_TIMEOUT:20s}
    greenhouse:
      board-tokens: ${GREENHOUSE_BOARD_TOKENS:}
    lever:
      companies: ${LEVER_COMPANIES:leverdemo}
    ashby:
      boards: ${ASHBY_BOARDS:Ashby}
    matching:
      weights:
        skills: ${JOB_MATCH_SKILL_WEIGHT:0.7}
        experience: ${JOB_MATCH_EXPERIENCE_WEIGHT:0.2}
        preferences: ${JOB_MATCH_PREFERENCE_WEIGHT:0.1}
    known-skills:
      - Java
      - Spring Boot
      - PostgreSQL
      - SQL
      - Python
      - JavaScript
      - TypeScript
      - React
      - AWS
      - Azure
      - Docker
      - Kubernetes

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${TEST_DB_URL}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}

app:
  cors:
    allowed-origin: ${TEST_FRONTEND_ORIGIN}